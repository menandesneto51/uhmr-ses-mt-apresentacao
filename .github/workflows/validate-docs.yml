name: Validate UHMR Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation
        run: python scripts/validate_documentation.py
